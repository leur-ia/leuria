name: Portal

# Every push to main that touches the docs, the portal or the packages builds
# the developer portal (apps/portal) and publishes it on GitHub Pages (leuria.dev).

on:
  push:
    branches: [main]
    paths: ["docs/**", "apps/portal/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/portal.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The portal documents the packages from their built code: build them first.
      - run: pnpm build
      - run: pnpm --filter @leuria/portal build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portal/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
