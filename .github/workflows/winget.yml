name: winget

# When a release is published, send its Windows installer to the Windows
# Package Manager (a pull request to microsoft/winget-pkgs). See packaging/winget/.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.3
        required: true

jobs:
  winget:
    runs-on: windows-latest
    env:
      READY: ${{ secrets.WINGET_ACC_TOKEN != '' }}
    steps:
      - if: env.READY != 'true'
        run: echo "No WINGET_ACC_TOKEN secret, nothing sent. See packaging/winget/README.md."
      - if: env.READY == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Leuria.Leuria
          # The versioned setup programs (x64 and ARM64) only: not the stable-name copies, nor the MSIs.
          installers-regex: '_(x64|arm64)-setup\.exe$'
          release-tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.WINGET_ACC_TOKEN }}
