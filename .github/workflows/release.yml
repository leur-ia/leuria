name: Release

# Push a tag like v0.1.0 (the version in apps/desktop/src-tauri/tauri.conf.json):
# this builds Leuria for Apple Silicon and Intel Macs and for Windows into a
# draft release. Publishing the draft makes it the download on leuria.eu, the
# update running apps install, and the Homebrew cask in Casks/ (see homebrew.yml).
#
# Windows builds are signed through SignPath when the SIGNPATH_* variables and
# secret are set in the repository settings; without them they are unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: apple-silicon
          - target: x86_64-apple-darwin
            name: intel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, app version $version"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm --filter @leuria/desktop build:engine
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}

      - name: Build and upload the app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs updates (not the app: it is ad-hoc signed until Leuria has an Apple Developer ID).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # tauri.release.conf.json adds the update files, which need the signing key above.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: Leuria __VERSION__
          releaseBody: Download Leuria for your Mac or Windows below, or install it on a Mac with Homebrew.
          releaseDraft: true

      # Stable names, so leuria.eu and the cask can link to .../latest/download/<name>.
      - name: Upload the installer under a stable name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          dmg=$(ls apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          cp "$dmg" "Leuria-mac-${{ matrix.name }}.dmg"
          gh release upload "v$version" "Leuria-mac-${{ matrix.name }}.dmg" --clobber

  windows:
    # Native builds: x64, and ARM64 for Windows on ARM (Snapdragon laptops,
    # Windows in a virtual machine on an Apple Silicon Mac). Under emulation
    # the x64 build can't set up the AI apps there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TARGET: ${{ matrix.target }}
      # Code signing is on once the SignPath project exists (see the top of this file).
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: The tag matches the app's version
        id: version
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, app version $version"; exit 1; }
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build the engine
        run: pnpm --filter @leuria/desktop build:engine
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ env.TARGET }}

      # In three steps, so that what the installer holds is signed before the
      # installer itself is built: the app, then its installer.
      - name: Build the app
        working-directory: apps/desktop
        run: pnpm tauri build --target "$TARGET" --no-bundle

      - name: Gather the programs to sign
        if: env.SIGN == 'true'
        run: |
          mkdir -p unsigned/app
          cp "apps/desktop/src-tauri/target/$TARGET/release/leuria-desktop.exe" unsigned/app/
          cp "apps/desktop/src-tauri/binaries/leuria-engine-$TARGET.exe" unsigned/app/leuria-engine.exe
      - name: Upload the programs to sign
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-${{ matrix.arch }}
          path: unsigned/app
      - name: Sign the programs
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          # The artifact configuration checks the programs carry this version.
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          # Each release waits for someone to approve it in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/app
      - name: Put the signed programs back
        if: env.SIGN == 'true'
        run: |
          cp signed/app/leuria-desktop.exe "apps/desktop/src-tauri/target/$TARGET/release/leuria-desktop.exe"
          cp signed/app/leuria-engine.exe "apps/desktop/src-tauri/binaries/leuria-engine-$TARGET.exe"

      - name: Build the installer
        working-directory: apps/desktop
        env:
          # Signs updates (the installer's .sig, which running apps check).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri bundle --target "$TARGET" --bundles nsis,msi --config src-tauri/tauri.release.conf.json

      # Two installers: the setup program most people get (for them alone, no
      # administrator), and an MSI for companies that install for everyone.
      - name: Find the installers
        id: installer
        run: |
          path=$(ls "apps/desktop/src-tauri/target/$TARGET/release/bundle/nsis/"*-setup.exe)
          msi=$(ls "apps/desktop/src-tauri/target/$TARGET/release/bundle/msi/"*.msi)
          {
            echo "path=$path"
            echo "dir=$(dirname "$path")"
            echo "name=$(basename "$path")"
            echo "msi=$msi"
            echo "msi-dir=$(dirname "$msi")"
            echo "msi-name=$(basename "$msi")"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the installer to sign
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ matrix.arch }}
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.msi }}
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installer
      # The update signature must be over the file people download: the signed one.
      - name: Put the signed installer back, and sign it for updates again
        if: env.SIGN == 'true'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          installer="$GITHUB_WORKSPACE/${{ steps.installer.outputs.path }}"
          msi="$GITHUB_WORKSPACE/${{ steps.installer.outputs.msi }}"
          cp "$GITHUB_WORKSPACE/signed/installer/${{ steps.installer.outputs.name }}" "$installer"
          cp "$GITHUB_WORKSPACE/signed/installer/${{ steps.installer.outputs.msi-name }}" "$msi"
          pnpm tauri signer sign --app-version "${{ steps.version.outputs.version }}" "$installer"
          pnpm tauri signer sign --app-version "${{ steps.version.outputs.version }}" "$msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            ${{ steps.installer.outputs.dir }}/${{ steps.installer.outputs.name }}
            ${{ steps.installer.outputs.dir }}/${{ steps.installer.outputs.name }}.sig
            ${{ steps.installer.outputs.msi-dir }}/${{ steps.installer.outputs.msi-name }}
            ${{ steps.installer.outputs.msi-dir }}/${{ steps.installer.outputs.msi-name }}.sig

  # After the Mac builds, which create the draft release and its latest.json:
  # add the Windows installer and its update entry.
  windows-release:
    needs: [desktop, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: windows
      - name: Upload the installers, and add them to the update file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          gh release download "v$VERSION" --pattern latest.json --dir .
          entry() {
            jq -n --arg signature "$(cat "$1.sig")" \
              --arg url "https://github.com/$GH_REPO/releases/download/v$VERSION/$(basename "$1")" \
              '{signature: $signature, url: $url}'
          }
          # arch in the artifact name, platform key in latest.json, suffix of the stable names.
          for build in "x64 x86_64 " "arm64 aarch64 -arm"; do
            read -r arch platform suffix <<< "$build"
            dir="windows/windows-$arch"
            # The setup program and the MSI come from different bundle folders (nsis/, msi/).
            installer=$(find "$dir" -name '*-setup.exe')
            msi=$(find "$dir" -name '*.msi')
            # Stable names too, so leuria.eu can link to .../latest/download/Leuria-windows-setup.exe.
            cp "$installer" "Leuria-windows$suffix-setup.exe"
            cp "$msi" "Leuria-windows$suffix.msi"
            gh release upload "v$VERSION" "$installer" "$installer.sig" "$msi" "$msi.sig" \
              "Leuria-windows$suffix-setup.exe" "Leuria-windows$suffix.msi" --clobber
            # An app installed from the MSI updates from the MSI, so it stays one install for everyone.
            jq --argjson setup "$(entry "$installer")" --argjson msi "$(entry "$msi")" --arg p "windows-$platform" \
              '.platforms[$p] = $setup | .platforms[$p + "-nsis"] = $setup | .platforms[$p + "-msi"] = $msi' \
              latest.json > latest.next.json
            mv latest.next.json latest.json
          done
          gh release upload "v$VERSION" latest.json --clobber
